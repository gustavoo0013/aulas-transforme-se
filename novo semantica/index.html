<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tags Semânticas</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>TAG HEADER - Cabeçalho Superior</h1>
      </header>

      <main>
        <aside>
          <section class="esquerda">
            <p>Tag Section - Lado Esquerdo</p>

            <nav>
              <p>Tag NAV</p>
            </nav>
          </section>

          <section class="publicidade">
            <p>Tag Aside - Publicidade</p>
          </section>
        </aside>

        <section class="direita">
          <p>Section lado direito</p>

          <article>
            <p>Tag Article</p>

            <h2>Tag H1 - Título Article</h2>

            <p class="texto">Tag p - Área para texto</p>

            <div class="imagem">
              <p>Tag Div - tag para colocar imagem</p>
            </div>
          </article>
        </section>
      </main>

      <footer>Rodapé</footer>
    </div>
  </body>
</html>
