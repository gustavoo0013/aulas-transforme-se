<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas</title>
    <style>
      table,
      td {
        border: 1px solid #000;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>produtos</th>
        <th>preco</th>
      </tr>

      <tr>
        <td>cafe</td>
        <td>19,99</td>
      </tr>

      <tr>
        <td>arroz</td>
        <td>29,99</td>
      </tr>
    </table>
  </body>
</html>
