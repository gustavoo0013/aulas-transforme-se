<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabela completa</title>

    <style>
      body {
        background-color: #000;
      }

      table {
        width: 400px;
        font-size: 15px;
      }

      td {
        width: 20px;
        height: 20px;
        text-align: center;
        vertical-align: center;
      }

      table,
      td {
        border: 1px solid #000;
        border-collapse: collapse;
      }

      thead {
        background-color: blueviolet;
      }

      tbody {
        background-color: gray;
        color: white;
      }

      tfoot {
        background-color: blueviolet;
      }

      caption {
        background-color: blueviolet;
      }

      .titulo {
        background-color: white;
        color: #000;
      }
    </style>
  </head>
  <body>
    <table>
      <!--titulo-->
      <caption>
        titulo da tabela
      </caption>

      <!--cabeçalho da tabela-->
      <thead>
        <tr>
          <th>mes</th>
          <th>servico</th>
          <th>valor</th>
        </tr>
      </thead>

      <!--corpo da tabela-->
      <tbody>
        <tr class="titulo">
          <td>janeiro</td>
          <td>consultoria</td>
          <td>R$ 2.000</td>
        </tr>

        <tr>
          <td rowspan="2">fevereiro</td>
          <td>Desenvolvimento</td>
          <td>R$ 8.000</td>
        </tr>

        <tr>
          <td>suporte</td>
          <td>R$ 3.000</td>
        </tr>

        <tr class="titulo">
          <td>março</td>
          <td>front-end</td>
          <td>R$ 9.000</td>
        </tr>
      </tbody>

      <!--rodape da tabela-->
      <tfoot>
        <tr>
          <th colspan="2">Total Geral</th>
          <td>R$ 21.000</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
