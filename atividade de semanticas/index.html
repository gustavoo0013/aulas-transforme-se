<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tags Semânticas</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>TAG HEADER - Cabeçalho Superior</h1>
    </header>

    <main>
      <aside>
        <section>
          <h2>Tag SECTION - Caixa Esquerda</h2>
          <p>Tag NAV</p>
        </section>

        <section>
          <h2>Tag ASIDE - Parte Lateral</h2>
          <p>Conteúdo lateral</p>
        </section>
      </aside>

      <article>
        <header>
          <p>Tag Article</p>
          <h1>Tag H1 - Título Article</h1>
        </header>

        <section>
          <h2>Tag &lt;section&gt;</h2>
          <p>Conteúdo da seção.</p>
        </section>

        <section>
          <h2>Tag &lt;section&gt;</h2>
          <p>Mais conteúdo da seção.</p>
        </section>
      </article>
    </main>

    <footer>
      <p>Tag Footer</p>
    </footer>
  </body>
</html>
